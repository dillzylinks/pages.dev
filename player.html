<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DILLZY LINKS - Live Player</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: sans-serif;
        }
        #video-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }
        .telegram-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #0088cc;
            color: #fff;
            padding: 8px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .error-msg {
            color: white;
            text-align: center;
            margin-top: 25vh;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div id="video-container">
        <!-- Branded Telegram Join Button -->
        <a href="https://t.me/+GVzLKNGz_OZlNmU1" target="_blank" class="telegram-btn">
           Join @Dillzylinks
        </a>

        <!-- Main Stream Iframe with Strict Sandbox to Block Popups -->
        <iframe id="stream-iframe" src="" allowfullscreen allow="encrypted-media; autoplay; pointer-lock" sandbox="allow-scripts allow-same-origin allow-presentation"></iframe>
    </div>

    <script>
        async function initPlayer() {
            const urlParams = new URLSearchParams(window.location.search);
            const streamId = urlParams.get('id');

            if (!streamId) {
                document.getElementById('video-container').innerHTML = '<div class="error-msg">⚠️ No Stream ID provided!</div>';
                return;
            }

            try {
                const response = await fetch('id.json');
                const data = await response.json();
                
                let streamItem = null;
                if (Array.isArray(data)) {
                    streamItem = data.find(item => item.id === streamId);
                } else if (data[streamId]) {
                    streamItem = data[streamId];
                }

                if (streamItem && streamItem.iframeSrc) {
                    document.getElementById('stream-iframe').src = streamItem.iframeSrc;
                } else {
                    document.getElementById('video-container').innerHTML = '<div class="error-msg">⚠️ Stream configuration not found!</div>';
                }

            } catch (err) {
                document.getElementById('video-container').innerHTML = '<div class="error-msg">⚠️ Error loading stream data!</div>';
            }

            // Hit counter trigger in background
            try {
                fetch(`https://hit-counter-theta.vercel.app/api/hit?key=${streamId}`);
            } catch(e) {}
        }

        document.addEventListener('DOMContentLoaded', initPlayer);
    </script>
</body>
</html>
