<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <iframe id="streamFrame" src="https://sportlinks10.pages.dev/?id=fc2" allowfullscreen></iframe>

    <script>
        // Yeh script kisi bhi naye pop-up tab ya window ko khulne se rok degi
        window.open = function() {
            console.log("Pop-up blocked!");
            return null;
        };

        // Agar iframe ke andar koi naya link _blank (naye tab) mein khulne ki koshish karega toh use yhi block kar denge
        document.getElementById('streamFrame').addEventListener('load', function() {
            try {
                var iframeDoc = this.contentWindow.document;
                iframeDoc.addEventListener('click', function(e) {
                    var target = e.target.closest('a');
                    if (target && target.target === '_blank') {
                        target.target = '_self'; // Naye tab mein khulne ki jagah wahin rok dega
                    }
                }, true);
            } catch (err) {
                console.log("Cross-origin restriction");
            }
        });
    </script>

</body>
</html>
